# 最小 CI：JVM 单测 + lint 两道闸门（§7.3）。
# 实跑状态：已随推送在 GitHub Actions 实跑。单测编译期曾因依赖校验
# 缺 org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0 的 pom 登记失败，
# 该条与三平台 aapt2 校验值已补入 gradle/verification-metadata.xml，
# 单测步骤已转绿；其后 lint 在 generateDebugAndroidTestLintModel 处
# 因 androidTest classpath 另有 13 个构件（compose ui-test 系列的
# .module、coroutines 1.8.1 等）未登记而失败，补齐后实跑又报
# coroutines-test 1.9.0 的 .module——冲突仲裁会抓落选版本的元数据
# 文件，这类登记缺口本地因缓存记录不可见、只能以远端实跑为准；
# coroutines 与 tracing 两簇全部版本已按官方 sha1 双核补齐。
# 已知前提：testDebugUnitTest 与 lint 不打包 APK、不执行 CMake 原生
# 构建，按 AGP 任务图不需要 app/src/main/cpp/deps 产物，故不跑
# install-deps.sh。若实际运行时因 externalNativeBuild 配置期检查等
# 原因失败，在 test 步骤前加一步：
#   - name: Install native deps
#     run: bash install-deps.sh
# assembleRelease 已纳入（C-L-05）：release 轮覆盖 R8 混淆后 JNI 反射
# 与原生构建。签名用 CI 内现生成的临时 keystore（只验构建与 dex，
# 不出可发包；正式签名 key 只在发布机上）；原生 deps 由 install-deps.sh
# 拉取。verify_release.sh 只在发布机跑（它核对正式签名指纹与发布
# 版本号），CI 改用等价 dex grep：onHostCall 在 dex 内有命中。
# 仪器测试（迁移/JNI 冒烟）走 android-test.yml 手动触发，不在每次推送跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 只取消 PR 的旧运行：main 推送的运行不互相取消，保证每个出包
  # 提交都有独立的完整 CI 结论
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Rebuild resource.zip
        run: bash tools/wanxiang-builtin/build-resource.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lint

      - name: Install native deps
        run: bash install-deps.sh

      - name: Release build (R8 + native)
        run: |
          keytool -genkeypair -keystore ci-debug.keystore -storepass ci-debug -keypass ci-debug -alias ci-debug -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" -noprompt
          ./gradlew clean assembleRelease -PJIME_STORE_FILE=$PWD/ci-debug.keystore -PJIME_STORE_PASSWORD=ci-debug -PJIME_KEY_ALIAS=ci-debug -PJIME_KEY_PASSWORD=ci-debug

      - name: Verify onHostCall survived R8 (dex grep)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          for DEX in $(unzip -l "$APK" | awk '/classes[0-9]*\.dex/ {print $4}'); do
            unzip -p "$APK" "$DEX" | strings | grep -q onHostCall && exit 0
          done
          echo "onHostCall not found in dex" >&2
          exit 1
