# 最小 CI：JVM 单测 + lint 两道闸门（§7.3）。
# 未实测：本文件随修复批新增，尚未在 GitHub Actions 上实际跑过。
# 已知前提：testDebugUnitTest 与 lint 不打包 APK、不执行 CMake 原生
# 构建，按 AGP 任务图不需要 app/src/main/cpp/deps 产物，故不跑
# install-deps.sh。若实际运行时因 externalNativeBuild 配置期检查等
# 原因失败，在 test 步骤前加一步：
#   - name: Install native deps
#     run: ./install-deps.sh
# assembleRelease 暂不纳入（需签名配置与原生 deps，另行评估）。
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lint
