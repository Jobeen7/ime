# 最小 CI：JVM 单测 + lint 两道闸门（§7.3）。
# 实跑状态：已随推送在 GitHub Actions 实跑。单测编译期曾因依赖校验
# 缺 org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0 的 pom 登记失败，
# 该条与三平台 aapt2 校验值已补入 gradle/verification-metadata.xml，
# 单测步骤已转绿；其后 lint 在 generateDebugAndroidTestLintModel 处
# 因 androidTest classpath 另有 13 个构件（compose ui-test 系列的
# .module、coroutines 1.8.1 等）未登记而失败，亦已补齐并本地强制
# 重验通过，待本次推送确认远端转绿。
# 已知前提：testDebugUnitTest 与 lint 不打包 APK、不执行 CMake 原生
# 构建，按 AGP 任务图不需要 app/src/main/cpp/deps 产物，故不跑
# install-deps.sh。若实际运行时因 externalNativeBuild 配置期检查等
# 原因失败，在 test 步骤前加一步：
#   - name: Install native deps
#     run: bash install-deps.sh
# assembleRelease 暂不纳入（需签名配置与原生 deps，另行评估）。
# 仪器测试（迁移/JNI 冒烟）走 android-test.yml 手动触发，不在每次推送跑。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lint
