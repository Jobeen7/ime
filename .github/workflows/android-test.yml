# 仪器测试：仅手动触发（workflow_dispatch），不在每次推送时跑。
# 用途：DatabaseMigrationTest（数据库迁移，测试内以测试专用库名建库，
# 不触碰生产数据）与 RimeJniSmokeTest（原生库加载冒烟）需要真机或
# 模拟器，且 RimeJniSmokeTest 需要原生 deps 先行就位
# （install-deps.sh），connectedDebugAndroidTest 只能在带模拟器的
# job 里执行，故与 ci.yml 的单测/lint 分开、按需手动跑。
name: AndroidTest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Install native deps
        run: bash install-deps.sh

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
