<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jime 输入法 — 基于 Rime 的 Android 输入法</title>
<meta name="description" content="Jime 是一款基于 Rime 的 Android 输入法，支持万象方案、全拼/双拼/九宫格、本地离线语音识别、剪贴板与常用语、用户词典同步。">
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #F5F6F8; color: #17181C; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 30px; margin: 0 0 10px; }
  p.lead { font-size: 16px; color: #555B64; line-height: 1.7; margin: 0 0 28px; }
  ul { line-height: 2; color: #33373E; padding-left: 20px; }
  .btns { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn { background: #2E5BFF; color: #fff; text-decoration: none; padding: 11px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; }
  a.btn.ghost { background: #fff; color: #17181C; border: 1px solid #E2E4E9; }
  footer { margin-top: 48px; color: #9AA0A8; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Jime 输入法</h1>
  <p class="lead">基于 Rime 的 Android 输入法：方案可扩展，打字跟手，语音识别全程本地离线、不上传录音。</p>
  <ul>
    <li>内置万象方案，支持全拼、双拼、九宫格</li>
    <li>本地离线语音转文字，边说边出字</li>
    <li>剪贴板历史与常用语、候选联想与打字学习</li>
    <li>用户词典 WebDAV 同步，设置可加密备份还原</li>
  </ul>
  <div class="btns">
    <a class="btn" href="https://github.com/Jobeen7/ime/releases/latest">下载最新正式版</a>
    <a class="btn ghost" href="https://github.com/Jobeen7/ime">GitHub 仓库</a>
  </div>
  <footer>开源项目，欢迎在仓库提交反馈与建议。</footer>
</main>
</body>
</html>
