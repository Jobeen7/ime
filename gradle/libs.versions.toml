[versions]
agp = "9.1.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coroutines = "1.11.0"
material = "1.14.0"
splitties = "3.0.0"
timber = "5.0.1"
kotlinxSerialization = "1.11.0"
ksp = "2.3.10"
