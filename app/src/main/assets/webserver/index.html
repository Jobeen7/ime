<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jime Wi-Fi 传输</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 860px; padding: 16px; color: #222; }
  h1 { font-size: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  tr.dir td:first-child { font-weight: 600; }
  button { margin: 2px; padding: 6px 12px; cursor: pointer; }
  input[type=text], input[type=password] { padding: 8px; width: 240px; }
  .crumb { margin: 12px 0; }
  .crumb a { cursor: pointer; color: #0b62c4; text-decoration: underline; }
  .hidden { display: none; }
  #msg { color: #b00; min-height: 1.2em; }
  progress { width: 100%; }
</style>
</head>
<body>
<h1>Jime Wi-Fi 传输</h1>

<div id="login">
  <p>请输入 Wi-Fi 传输密码（在手机 Jime 设置 → Wi-Fi 传输里设置）。</p>
  <input type="password" id="password" placeholder="密码" autocomplete="current-password">
  <button id="loginBtn">登录</button>
  <p id="msg"></p>
</div>

<div id="browser" class="hidden">
  <div class="crumb" id="crumbs"></div>
  <div>
    <input type="file" id="fileInput" multiple>
    <button id="uploadBtn">上传</button>
    <button id="mkdirBtn">新建目录</button>
    <button id="logoutBtn">退出登录</button>
  </div>
  <progress id="progress" value="0" max="100" class="hidden"></progress>
  <p id="status"></p>
  <table>
    <thead><tr><th>名称</th><th>大小</th><th>操作</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script>
const tokenKey = 'jime-web-token';
let currentPath = '';

function token() { return sessionStorage.getItem(tokenKey); }

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {}, { 'Authorization': 'Bearer ' + token() });
  const res = await fetch(path, opts);
  if (res.status === 401) { showLogin('登录已过期，请重新登录。'); throw new Error('unauthorized'); }
  return res;
}

function showLogin(msg) {
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('browser').classList.add('hidden');
  if (msg) document.getElementById('msg').textContent = msg;
}
function showBrowser() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('browser').classList.remove('hidden');
  list(currentPath);
}

function fmtSize(n) {
  if (n == null) return '-';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function joinPath(base, name) { return base ? base + '/' + name : name; }

async function list(path) {
  currentPath = path;
  const res = await api('/api/resources?path=' + encodeURIComponent(path));
  if (!res.ok) { document.getElementById('status').textContent = '列表失败：' + res.status; return; }
  const data = await res.json();
  const crumbs = document.getElementById('crumbs');
  crumbs.innerHTML = '';
  const root = document.createElement('a');
  root.textContent = '根目录';
  root.onclick = () => list('');
  crumbs.appendChild(root);
  path.split('/').filter(Boolean).forEach((seg, i, arr) => {
    crumbs.appendChild(document.createTextNode(' / '));
    const a = document.createElement('a');
    a.textContent = seg;
    const p = arr.slice(0, i + 1).join('/');
    a.onclick = () => list(p);
    crumbs.appendChild(a);
  });
  const tbody = document.getElementById('list');
  tbody.innerHTML = '';
  (data.items || []).forEach(item => {
    const tr = document.createElement('tr');
    if (item.type === 'dir') tr.className = 'dir';
    const nameTd = document.createElement('td');
    const full = joinPath(path, item.name);
    if (item.type === 'dir') {
      const a = document.createElement('a');
      a.textContent = item.name + '/';
      a.style.cursor = 'pointer';
      a.onclick = () => list(full);
      nameTd.appendChild(a);
    } else {
      nameTd.textContent = item.name;
    }
    tr.appendChild(nameTd);
    const sizeTd = document.createElement('td');
    sizeTd.textContent = item.type === 'dir' ? '-' : fmtSize(item.size);
    tr.appendChild(sizeTd);
    const opTd = document.createElement('td');
    if (item.type === 'file') {
      const dl = document.createElement('button');
      dl.textContent = '下载';
      dl.onclick = () => downloadFile(full);
      opTd.appendChild(dl);
    }
    const del = document.createElement('button');
    del.textContent = '删除';
    del.onclick = async () => {
      if (!confirm('删除 ' + full + '？')) return;
      const r = await api('/api/resources?path=' + encodeURIComponent(full), { method: 'DELETE' });
      if (!r.ok) alert('删除失败：' + r.status);
      list(path);
    };
    opTd.appendChild(del);
    tr.appendChild(opTd);
    tbody.appendChild(tr);
  });
  document.getElementById('status').textContent = '';
}

async function downloadFile(path) {
  const res = await api('/api/raw?path=' + encodeURIComponent(path));
  if (!res.ok) { alert('下载失败：' + res.status); return; }
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = path.split('/').pop();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function uploadOne(file) {
  const path = joinPath(currentPath, file.name);
  const progress = document.getElementById('progress');
  progress.classList.remove('hidden');
  if (file.size < 8 * 1024 * 1024) {
    const res = await api('/api/resources?path=' + encodeURIComponent(path), { method: 'PUT', body: file });
    if (!res.ok) throw new Error('上传失败：' + res.status);
    progress.value = 100;
    return;
  }
  // 大文件走 tus 断点续传。
  const create = await api('/api/tus?path=' + encodeURIComponent(path) + '&override=true', { method: 'POST' });
  if (!create.ok) throw new Error('创建上传失败：' + create.status);
  const location = create.headers.get('Location');
  const chunk = 1024 * 1024;
  let offset = 0;
  while (offset < file.size) {
    const end = Math.min(offset + chunk, file.size);
    const res = await api(location, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/offset+octet-stream', 'Upload-Offset': String(offset) },
      body: file.slice(offset, end),
    });
    if (res.status === 409) {
      const st = await api(location, { method: 'HEAD' });
      offset = parseInt(st.headers.get('Upload-Offset') || '0', 10);
      continue;
    }
    if (!res.ok && res.status !== 204) throw new Error('分片失败：' + res.status);
    offset = parseInt(res.headers.get('Upload-Offset') || String(end), 10);
    progress.value = Math.round(offset / file.size * 100);
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const password = document.getElementById('password').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (!res.ok) { document.getElementById('msg').textContent = '密码错误。'; return; }
  const data = await res.json();
  sessionStorage.setItem(tokenKey, data.token);
  document.getElementById('msg').textContent = '';
  showBrowser();
};
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('logoutBtn').onclick = () => {
  sessionStorage.removeItem(tokenKey);
  showLogin('');
};
document.getElementById('mkdirBtn').onclick = async () => {
  const name = prompt('新目录名：');
  if (!name) return;
  const path = joinPath(currentPath, name) + '/';
  const res = await api('/api/resources?path=' + encodeURIComponent(path), { method: 'POST' });
  if (!res.ok) alert('新建失败：' + res.status);
  list(currentPath);
};
document.getElementById('uploadBtn').onclick = async () => {
  const files = document.getElementById('fileInput').files;
  if (!files.length) return;
  const status = document.getElementById('status');
  try {
    for (const file of files) {
      status.textContent = '正在上传 ' + file.name + '…';
      await uploadOne(file);
    }
    status.textContent = '上传完成。';
  } catch (e) {
    status.textContent = e.message;
  }
  document.getElementById('progress').classList.add('hidden');
  document.getElementById('fileInput').value = '';
  list(currentPath);
};

if (token()) { showBrowser(); }
</script>
</body>
</html>
